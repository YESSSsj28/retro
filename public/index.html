<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fast Google Proxy</title>
  <style>
    body { margin:0; background:#111; color:#fff; font-family:Arial,sans-serif; display:flex; flex-direction:column; height:100vh; }
    header { padding:10px; text-align:center; background:#222; }
    header h1 { margin:0; font-size:24px; }
    #searchForm { display:flex; justify-content:center; margin:10px 0; }
    #query { width:60%; padding:10px; font-size:16px; border-radius:5px 0 0 5px; border:none; outline:none; }
    #searchBtn { padding:10px 20px; font-size:16px; border:none; background:#4CAF50; color:white; border-radius:0 5px 5px 0; cursor:pointer; }
    iframe { flex-grow:1; width:100%; border:none; }
  </style>
</head>
<body>
  <header><h1>Fast Google Portal</h1></header>
  <form id="searchForm">
    <input type="text" id="query" placeholder="Type your search here...">
    <button type="submit" id="searchBtn">Search</button>
  </form>
  <iframe id="resultFrame" src="https://www.google.com/webhp?igu=1"></iframe>
  <script>
    const form=document.getElementById('searchForm');
    const queryInput=document.getElementById('query');
    const iframe=document.getElementById('resultFrame');
    form.addEventListener('submit',e=>{e.preventDefault();const q=queryInput.value.trim();if(q) iframe.src=`https://www.google.com/search?q=${encodeURIComponent(q)}&igu=1`;});
    queryInput.addEventListener('keypress',e=>{if(e.key==='Enter') form.dispatchEvent(new Event('submit'));});
  </script>
</body>
</html>

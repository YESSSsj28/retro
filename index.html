<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Scoreboard</title>
    <style>
        :root {
            --blue: #3a86ff;
            --red: #ff006e;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .score {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            min-width: 120px;
            text-align: center;
        }
        
        .blue {
            color: var(--blue);
        }
        
        .red {
            color: var(--red);
        }
        
        .separator {
            font-size: 4rem;
            margin: 0 1rem;
            color: var(--gray);
        }
        
        .countdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--dark);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .countdown-number {
            font-size: 20vw;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
            transform: scale(0.5);
            opacity: 0;
            transition: all 0.3s;
        }
        
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .serve-btn {
            background: linear-gradient(135deg, var(--blue), #2667cc);
        }
        
        .blue-btn {
            background: rgba(58, 134, 255, 0.2);
            border: 1px solid var(--blue);
        }
        
        .red-btn {
            background: rgba(255, 0, 110, 0.2);
            border: 1px solid var(--red);
        }
        
        .reset-btn {
            background: rgba(108, 117, 125, 0.2);
            border: 1px solid var(--gray);
        }
        
        @media (max-width: 600px) {
            .score {
                font-size: 4rem;
                min-width: 90px;
            }
            
            .separator {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-screen" id="countdownScreen">
        <div class="countdown-number" id="countdownNumber"></div>
    </div>
    
    <div class="container" id="mainContainer">
        <div class="scoreboard">
            <div class="score blue" id="blueScore">0</div>
            <div class="separator">-</div>
            <div class="score red" id="redScore">0</div>
        </div>
        
        <div class="buttons">
            <button class="serve-btn" id="serveButton">SERVE</button>
            <button class="blue-btn" id="bluePoint">BLUE POINT</button>
            <button class="red-btn" id="redPoint">RED POINT</button>
            <button class="reset-btn" id="resetButton">RESET</button>
        </div>
    </div>
    
    <script>
        // DOM Elements
        const blueScoreElement = document.getElementById('blueScore');
        const redScoreElement = document.getElementById('redScore');
        const countdownScreen = document.getElementById('countdownScreen');
        const countdownNumber = document.getElementById('countdownNumber');
        const serveButton = document.getElementById('serveButton');
        const bluePointButton = document.getElementById('bluePoint');
        const redPointButton = document.getElementById('redPoint');
        const resetButton = document.getElementById('resetButton');
        const mainContainer = document.getElementById('mainContainer');
        
        // Game state
        let blueScore = 0;
        let redScore = 0;
        let isCountingDown = false;
        
        // Update score display
        function updateScores() {
            blueScoreElement.textContent = blueScore;
            redScoreElement.textContent = redScore;
        }
        
        // Fullscreen countdown
        function startServeCountdown() {
            if (isCountingDown) return;
            
            isCountingDown = true;
            mainContainer.style.filter = 'blur(4px)';
            countdownScreen.style.opacity = '1';
            countdownScreen.style.pointerEvents = 'auto';
            
            // 3
            countdownNumber.textContent = '3';
            countdownNumber.style.opacity = '1';
            countdownNumber.style.transform = 'scale(1)';
            
            setTimeout(() => {
                countdownNumber.style.opacity = '0';
                countdownNumber.style.transform = 'scale(0.5)';
            }, 800);
            
            // 2
            setTimeout(() => {
                countdownNumber.textContent = '2';
                countdownNumber.style.opacity = '1';
                countdownNumber.style.transform = 'scale(1)';
            }, 1000);
            
            setTimeout(() => {
                countdownNumber.style.opacity = '0';
                countdownNumber.style.transform = 'scale(0.5)';
            }, 1800);
            
            // 1
            setTimeout(() => {
                countdownNumber.textContent = '1';
                countdownNumber.style.opacity = '1';
                countdownNumber.style.transform = 'scale(1)';
            }, 2000);
            
            setTimeout(() => {
                countdownNumber.style.opacity = '0';
                countdownNumber.style.transform = 'scale(0.5)';
            }, 2800);
            
            // Return to game
            setTimeout(() => {
                countdownScreen.style.opacity = '0';
                countdownScreen.style.pointerEvents = 'none';
                mainContainer.style.filter = 'none';
                isCountingDown = false;
            }, 3000);
        }
        
        // Event listeners
        serveButton.addEventListener('click', startServeCountdown);
        
        bluePointButton.addEventListener('click', () => {
            blueScore++;
            updateScores();
        });
        
        redPointButton.addEventListener('click', () => {
            redScore++;
            updateScores();
        });
        
        resetButton.addEventListener('click', () => {
            blueScore = 0;
            redScore = 0;
            updateScores();
        });
        
        // Initialize
        updateScores();
    </script>
</body>
</html>
</html>
